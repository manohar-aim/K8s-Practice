apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop 
  region: us-east-1
  version: "1.34"

availabilityZones:
  - us-east-1a
  - us-east-1b

managedNodeGroups:
  - name: roboshop-nodes
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 3
    volumeSize: 20
    ssh:
      allow: true